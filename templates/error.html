{# Friendly error page (404, 500 and others). Owner: Henry. H19 #}
{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block main_class %}page centred{% endblock %}

{% block content %}
<section class="card error-page">
  <p class="error-code" aria-hidden="true">{{ status }}</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <a class="button go" href="{{ url_for('index') }}">Go to the home page</a>
</section>
{% endblock %}
